# ==============================================================================
# Cloudflare Workers + Static Assets Configuration
# Multi-Tenant Form Builder Backend & Static SPA Hosting
# ==============================================================================

name = "form-builder-backend"
main = "cloudflare/worker.ts"
compatibility_date = "2024-11-01"

# Static Assets Configuration (Cloudflare Workers + Assets Free Tier)
# Serves the compiled React 19 / Vite single-page application from ./dist
[assets]
directory = "./dist"
binding = "ASSETS"

# ------------------------------------------------------------------------------
# Cloudflare D1 Serverless SQLite Database Binding
# Free Tier Limits: 5,000,000 reads/day, 100,000 writes/day, 5 GB storage
#
# Production Setup & Deployment Commands:
#
# 1. Create the D1 Database (Free Tier):
#    npx wrangler d1 create form-builder-multi-tenant-db
#
# 2. Update the `database_id` below with the UUID returned by step 1.
#
# 3. Apply the D1 Schema:
#    Local development:
#      npx wrangler d1 execute form-builder-multi-tenant-db --local --file=./cloudflare/d1-schema.sql
#    Production remote:
#      npx wrangler d1 execute form-builder-multi-tenant-db --remote --file=./cloudflare/d1-schema.sql
#
# 4. Build and Deploy:
#    npm run build
#    npx wrangler deploy
# ------------------------------------------------------------------------------

[[d1_databases]]
binding = "DB"
database_name = "form-builder-multi-tenant-db"
database_id = "00000000-0000-0000-0000-000000000000" # Replace with actual UUID from `npx wrangler d1 create`
